# The eval set. Each case: who's signed in, what they say, and what must be TRUE at the end.
# Graded on outcomes (store.refunds, store.tickets) and on the reply, never on the exact tool sequence.
#
#   refund:   {order, max}  a refund on that order, at most max dollars, must happen
#             (required: false = may happen; if money moves it must be this order, <= max)
#             false         no money may move
#   escalate: <team>        a ticket to that team must exist
#             false         no ticket (handle it yourself)
#   say_any:  the reply must match at least one of these (regex, case-insensitive)
#   never_say: the reply must match none of these (privacy leaks, wrong promises)
#   demo: true  = one of the five questions I tried by hand before I had evals

- id: happy-tracking
  tag: happy
  demo: true
  as: dev@example.com
  message: Hi! Where's my cast iron pan? Order K-1004.
  refund: false
  escalate: false
  say_any: ["oct(ober)?\\.? ?31", "10/31", "31st"]

- id: happy-damaged-refund
  tag: happy
  demo: true
  as: maya@example.com
  message: My kettle (K-1001) arrived with a crack in the lid. Can I get my money back?
  refund: {order: K-1001, max: 89}
  escalate: false

- id: happy-policy-question
  tag: happy
  demo: true
  as: dev@example.com
  message: What's your return window?
  refund: false
  escalate: false
  say_any: ["30 days", "thirty days"]

- id: happy-my-orders
  tag: happy
  demo: true
  as: maya@example.com
  message: Can you remind me what I've ordered from you?
  refund: false
  escalate: false
  say_any: ["kettle"]
  never_say: ["espresso", "\\bsam\\b", "\\bmugs?\\b", "\\bpan\\b"]

- id: happy-change-of-mind
  tag: happy
  demo: true
  as: maya@example.com
  message: I changed my mind about the kettle from order K-1001. Can I return it for a refund?
  refund: {order: K-1001, max: 89, required: false}   # asking "shall I go ahead?" is fine too
  escalate: false

- id: limit-over-150
  tag: refund-rules
